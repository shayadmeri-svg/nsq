# Single origin for the whole platform. Every service lives under a path, and
# the same path works locally and on the deployed box:
#
#   /                    React Q-engine SPA        (web:80)
#   /api/manufacturer/   Q-engine JSON API         (manufacturer-api:8001)
#   /analytics/          CDSCO NSQ dashboard       (analytics:8501, Streamlit)
#   /simulator/          CDMO workbench            (simulator:8502, Streamlit)
#   /manufacturer/       legacy tenant dashboard   (manufacturer:8503, Streamlit)
#   /engine/             four-pillar scoring API   (engine:8000, FastAPI)
#   /health              gateway liveness
#
# The three Streamlit apps run with --server.baseUrlPath=<name> (see their
# Dockerfiles), so they generate their own asset and websocket URLs already
# prefixed. That means NO path rewriting here — proxy_pass without a trailing
# slash, so /analytics/foo arrives as /analytics/foo. Adding a trailing slash
# to those proxy_pass lines strips the prefix and breaks every asset.

# NO `upstream` blocks, and every proxy_pass goes through a variable. This is
# deliberate. nginx resolves a hostname in an upstream block (or in a literal
# proxy_pass) exactly once, at startup, and caches the IP for the life of the
# process. Docker hands a container a new IP every time it is recreated, so
# after `docker compose up -d` rebuilt two services the gateway kept dialling
# their dead addresses and served 502 for them while they were perfectly
# healthy — /manufacturer/ and /api/manufacturer/ went down exactly that way.
#
# A variable in proxy_pass forces nginx to resolve per request instead, via
# Docker's embedded DNS at 127.0.0.11. valid=10s caps how long a stale answer
# can survive.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Plotly figures and Streamlit ForwardMsgs get large; don't buffer them
    # to disk on the way through.
    client_max_body_size 32m;
    proxy_buffering off;

    # --- shared proxy defaults -------------------------------------------
    # WARNING: nginx's proxy_set_header is all-or-nothing per level. A
    # location that sets ANY proxy_set_header inherits NONE of these. So the
    # websocket locations below repeat all four — dropping them silently cost
    # Streamlit its Host and X-Forwarded-For the first time round.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Streamlit apps ---------------------------------------------------
    # Upgrade/Connection are what carry the websocket at
    # /<app>/_stcore/stream. Without them Streamlit connects, fails, retries
    # forever, and the page sits on "Please wait...".
    # read_timeout covers a long rerun with no frames in flight; Streamlit's
    # own ping keeps the socket alive, but a slow cold render can exceed the
    # 60s default and get cut mid-page.
    location /analytics/ {
        set $upstream_analytics analytics:8501;
        proxy_pass http://$upstream_analytics$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
    location = /analytics { return 301 /analytics/; }

    location /simulator/ {
        set $upstream_simulator simulator:8502;
        proxy_pass http://$upstream_simulator$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
    location = /simulator { return 301 /simulator/; }

    location /manufacturer/ {
        set $upstream_manufacturer manufacturer:8503;
        proxy_pass http://$upstream_manufacturer$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
    location = /manufacturer { return 301 /manufacturer/; }

    # --- APIs --------------------------------------------------------------
    # manufacturer-api's own routes are already /api/manufacturer/*, so this
    # passes through unrewritten.
    location /api/manufacturer/ {
        set $upstream_api manufacturer-api:8001;
        proxy_pass http://$upstream_api$request_uri;
    }

    # The engine's routes are at the root (/molecules, /score, …), so here the
    # trailing slash on proxy_pass IS wanted: /engine/molecules -> /molecules.
    # uvicorn runs with --root-path /engine so FastAPI's generated links and
    # /engine/docs resolve correctly.
    location /engine/ {
        set $upstream_engine engine:8000;
        # With a variable, the trailing-slash form of proxy_pass cannot strip
        # the prefix, so rewrite does it: /engine/molecules -> /molecules.
        rewrite ^/engine/(.*)$ /$1 break;
        proxy_pass http://$upstream_engine;
    }
    location = /engine { return 301 /engine/; }

    # --- SPA + gateway health ---------------------------------------------
    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        set $upstream_web web:80;
        proxy_pass http://$upstream_web$request_uri;
    }
}
