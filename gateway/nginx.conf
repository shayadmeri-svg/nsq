# Single origin for the platform:
#
#   /            React SPA                       (web:80)
#   /api/        FastAPI backend                 (api:8001)
#   /analytics   retired Streamlit dashboard: redirects to Playground · Investigate
#   /health      gateway liveness
#
# Every proxy_pass goes through a variable so nginx re-resolves container
# names per request (Docker's DNS at 127.0.0.11); a literal upstream is
# resolved once at startup and goes stale when a container is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

server_tokens off;

# Behind Caddy: the client's address is in X-Forwarded-For. Trust it only from the Docker networks, so the limits
# below count per visitor instead of treating every request as Caddy's.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Rate limits per client address. Sign-in: slow enough to stop password guessing. API: well above what one person
# clicking around sends (a page fires a few requests at once; burst absorbs that). Agents push readings in bursts.
limit_req_zone $binary_remote_addr zone=signin:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=agents:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=streams:10m;
limit_req_status 429;
limit_conn_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Behind Caddy (HTTPS) keep the scheme it reports; when nginx faces the browser directly, use its own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 300m;  # source-file uploads (API limit is 300 MB)

    # Compress the JS/CSS bundle and API JSON (the bundle is ~1.6 MB raw, ~0.5 MB gzipped).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # --- server-sent event streams: unbuffered, long-lived, at most 10 open per visitor ------------------------------
    # The live plant monitor (Connect) and the live plant-data line (API). The apps send a frame at least every
    # 20 s, so a 1-hour read timeout only ends streams nobody is reading; browsers reconnect by themselves.
    location ~ ^/api/connect/plants/\d+/stream$ {
        limit_conn streams 10;
        set $upstream_connect connect:8020;
        proxy_pass http://$upstream_connect$request_uri;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location ~ ^/api/plant-data/[^/]+/live/stream$ {
        limit_conn streams 10;
        set $upstream_api api:8001;
        proxy_pass http://$upstream_api$request_uri;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # --- sign-in: 10 a minute per address, a burst of 5 ---------------------------------------------------------------
    location = /api/auth/login {
        limit_req zone=signin burst=5 nodelay;
        set $upstream_api api:8001;
        proxy_pass http://$upstream_api$request_uri;
    }

    # --- edge agents pushing readings (their own, higher limit) --------------------------------------------------------
    location ^~ /api/connect/agent/ {
        limit_req zone=agents burst=200 nodelay;
        client_max_body_size 20m;
        set $upstream_connect connect:8020;
        proxy_pass http://$upstream_connect$request_uri;
    }
    location ^~ /api/ingest/ {
        limit_req zone=agents burst=200 nodelay;
        client_max_body_size 20m;
        set $upstream_api api:8001;
        proxy_pass http://$upstream_api$request_uri;
    }

    # Eurveda Connect (integration service): plant setup, edge agents, live plant monitor
    location /api/connect/ {
        limit_req zone=api burst=60 nodelay;
        set $upstream_connect connect:8020;
        proxy_pass http://$upstream_connect$request_uri;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        set $upstream_api api:8001;
        proxy_pass http://$upstream_api$request_uri;
        # Job logs stream over server-sent events; large uploads stream through.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }

    # The Streamlit dashboard is retired (its last tab is Playground · Investigate). Old bookmarks land there;
    # a browser tab still open on it gets 410 Gone instead of polling the web app every second.
    location ^~ /analytics { return 301 /playground/investigate; }
    location ~ ^/(analytics|manufacturer)/_stcore/ { return 410; }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        set $upstream_web web:80;
        proxy_pass http://$upstream_web$request_uri;
    }
}
