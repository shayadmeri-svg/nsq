# Single origin for the platform:
#
#   /            React SPA                       (web:80)
#   /api/        FastAPI backend                 (api:8001)
#   /analytics/  legacy Streamlit dashboard      (analytics:8501, --profile legacy)
#                — only for signed-in users, via auth_request to /api/auth/check
#   /health      gateway liveness
#
# Every proxy_pass goes through a variable so nginx re-resolves container
# names per request (Docker's DNS at 127.0.0.11); a literal upstream is
# resolved once at startup and goes stale when a container is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 60m;   # CDSCO CSV uploads

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        set $upstream_api api:8001;
        proxy_pass http://$upstream_api$request_uri;
        # Job logs stream over server-sent events.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # --- legacy Streamlit, gated by the app session -----------------------
    location = /_auth {
        internal;
        set $upstream_api api:8001;
        proxy_pass http://$upstream_api/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location /analytics/ {
        auth_request /_auth;
        error_page 401 = @login;
        set $upstream_analytics analytics:8501;
        proxy_pass http://$upstream_analytics$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location = /analytics { return 301 /analytics/; }
    location @login { return 302 /login?next=$request_uri; }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        set $upstream_web web:80;
        proxy_pass http://$upstream_web$request_uri;
    }
}
