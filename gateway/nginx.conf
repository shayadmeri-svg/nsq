# Q-engine gateway — single origin in production. Proxies the manufacturer
# API and serves the React SPA so the browser never crosses origins (the
# API's CORS is only used for the Vite dev server).
upstream q_engine_api {
    server manufacturer-api:8001;
}

upstream q_engine_web {
    server web:80;
}

server {
    listen 80;
    server_name _;

    # Manufacturer API — same-origin, no CORS needed in prod.
    location /api/manufacturer/ {
        proxy_pass http://q_engine_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA + static assets.
    location / {
        proxy_pass http://q_engine_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}