# OPTIONAL — only needed if you keep a system nginx on the EC2 box.
#
# The compose `gateway` container is the real router (gateway/nginx.conf): it
# already serves every service under its own path. Preferred setup is to let
# it own port 80 directly and delete this file's site from the box:
#
#     sudo systemctl disable --now nginx
#     # .env: leave GATEWAY_PORT unset (defaults to 80)
#
# If you'd rather keep the system nginx in front (to add TLS, say), then:
#
#     # .env on the box:
#     GATEWAY_PORT=8080
#     # install this file:
#     sudo cp deploy/nginx-host.conf /etc/nginx/conf.d/nsq-platform.conf
#     sudo rm -f /etc/nginx/conf.d/default.conf     # if it owns "/"
#     sudo nginx -t && sudo systemctl reload nginx
#
# Everything below is a straight pass-through: paths are NOT rewritten here,
# because the gateway container is what knows the routing table. Keep it that
# way — two places that both rewrite paths is how a deploy breaks at 2am.

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamlit's websocket lives at /<app>/_stcore/stream. Without these
        # the apps load and then hang on "Please wait...".
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
