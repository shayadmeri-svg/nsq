# Inner nginx for the web (SPA) container — serves the built React bundle
# with a history-API fallback to index.html (SPA routing). The gateway
# container proxies / -> this service (and /api/ -> the FastAPI backend).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    # Static assets get a long cache (Vite hashes filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any unknown path serves index.html so client-side routes
    # (/dashboard, /diagnostics/:id) resolve on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html names the current bundle: never cache it, so a rebuild shows up on the next load
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}