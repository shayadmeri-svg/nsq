server {
    listen 80 default_server;
    server_name _;

    # Streamlit ships static assets from /static and speaks WebSocket for
    # live updates — both need the upgrade headers below or the app loads
    # blank / never refreshes.

    location /analytics/ {
        rewrite ^/analytics/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /analytics {
        return 301 /analytics/;
    }

    location /simulator/ {
        rewrite ^/simulator/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8502;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /simulator {
        return 301 /simulator/;
    }

    location / {
        return 200 'nsq-platform: see /analytics/ or /simulator/\n';
        add_header Content-Type text/plain;
    }
}
