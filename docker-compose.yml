name: nsq-platform

# The services read live data from the in-server `redis` container below,
# NOT from Upstash. Upstash (REDIS_URL in .env) is only the upstream copy
# the loaders write to; ./pull-upstash.sh copies it into this Redis once
# per data refresh, and deploy.sh seeds a fresh box the same way. That
# keeps the whole stack off the Upstash monthly command quota.
#
#   echo 'REDIS_URL=rediss://default:PASSWORD@your-instance.upstash.io:6379' > .env
#
# Escape hatch: set NSQ_REDIS_URL in .env to point the services somewhere
# else (e.g. straight at Upstash again). Never commit .env — it's gitignored.

services:
  # redis — the in-server copy of the static NSQ dataset that every service
  # reads. Seeded/refreshed from Upstash by ./pull-upstash.sh; persisted in
  # the redis-data volume (AOF), so restarts and redeploys keep the data.
  # Internal only: no host port is published.
  redis:
    image: redis:7-alpine
    container_name: nsq-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "300 1"
      # ~15 MB of data today; the cap is a guard for a small instance.
      # noeviction: this is a datastore, not a cache — never drop keys.
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - nsq-net

  analytics:
    build:
      context: ./analytics
    image: nsq-analytics:local
    container_name: nsq-analytics
    ports:
      - "8501:8501"
    environment:
      - REDIS_URL=${NSQ_REDIS_URL:-redis://redis:6379/0}
      # Local snapshot tier: served when Redis is unavailable (e.g. the
      # Upstash monthly command quota runs out). Shipped via the
      # git-tracked data/nsq_snapshot.json.gz — refresh with
      # `just snapshot-prod` and commit it alongside the data refresh.
      - NSQ_SNAPSHOT=/app/nsq_snapshot.json.gz
    volumes:
      - ./data/nsq_snapshot.json.gz:/app/nsq_snapshot.json.gz:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/analytics/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - nsq-net

  simulator:
    build:
      context: ./simulator
    image: nsq-simulator:local
    container_name: nsq-simulator
    ports:
      - "8502:8502"
    environment:
      - REDIS_URL=${NSQ_REDIS_URL:-redis://redis:6379/0}
      - CDMO_ENGINE_URL=http://engine:8000
      # Optional — paste a Gemini key to switch D3 diagnostics from the
      # local heuristic engine to live generative output. Leave unset to
      # stay fully offline.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      analytics:
        condition: service_healthy
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8502/simulator/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - nsq-net

  engine:
    build:
      context: ./engine
    image: nsq-engine:local
    container_name: nsq-engine
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=${NSQ_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - nsq-net

  # Manufacturer (tenant) app — user-facing Q-engine dashboard. One app,
  # config-driven tenant (NSQ_TENANT). Phase 1: dashboard only; no
  # depends_on the engine/simulator (those come in phase 2 diagnostics).
  manufacturer:
    build:
      context: ./manufacturer
    image: nsq-manufacturer:local
    container_name: nsq-manufacturer
    ports:
      - "8503:8503"
    environment:
      - REDIS_URL=${NSQ_REDIS_URL:-redis://redis:6379/0}
      - NSQ_TENANT=${NSQ_TENANT:-regent-ajanta-biotech}
      - NSQ_SNAPSHOT=/app/nsq_snapshot.json.gz
    volumes:
      - ./data/nsq_snapshot.json.gz:/app/nsq_snapshot.json.gz:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8503/manufacturer/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - nsq-net

  # manufacturer-api — the FastAPI wrapper over the headless diagnostics/GMP/
  # pharmacopeia cores + Plotly chart builders, serving the React frontend.
  # Replaces the Streamlit render layer; the Streamlit `manufacturer` service
  # above stays on 8503 for parity verification until the cutover.
  manufacturer-api:
    build:
      context: ./manufacturer_api
    image: nsq-manufacturer-api:local
    container_name: nsq-manufacturer-api
    expose:
      - "8001"
    environment:
      - REDIS_URL=${NSQ_REDIS_URL:-redis://redis:6379/0}
      # No NSQ_TENANT here, deliberately: unlike the Streamlit `manufacturer`
      # service (one container = one tenant, resolved from the env var), the
      # API takes the tenant from the request path
      # (/api/manufacturer/{tenant_key}/...) and never calls
      # tenants.get_active_tenant(). An NSQ_TENANT set here would look like a
      # working knob and do nothing.
      - MANUFACTURER_API_CORS_ORIGINS=${MANUFACTURER_API_CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      - NSQ_SNAPSHOT=/app/nsq_snapshot.json.gz
    volumes:
      - ./data/nsq_snapshot.json.gz:/app/nsq_snapshot.json.gz:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - nsq-net

  # web — the React SPA (Vite build) served by nginx. Internal port 80; only
  # the gateway publishes a host port (8080) in the default topology.
  web:
    build:
      context: ./web
    image: nsq-web:local
    container_name: nsq-web
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - nsq-net

  # gateway — THE single entry point. Serves the SPA at / and proxies every
  # other service under its own path (see gateway/nginx.conf):
  #   /analytics/  /simulator/  /manufacturer/  /engine/  /api/manufacturer/
  # Published on host port 80 so the deployed box needs no separate nginx.
  # Set GATEWAY_PORT in .env if something else already owns 80 on the host
  # (e.g. an existing system nginx you want to keep in front).
  gateway:
    image: nginx:alpine
    container_name: nsq-gateway
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      web:
        condition: service_healthy
      manufacturer-api:
        condition: service_healthy
      analytics:
        condition: service_healthy
      simulator:
        condition: service_healthy
      manufacturer:
        condition: service_healthy
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - nsq-net

networks:
  nsq-net:
    driver: bridge

volumes:
  redis-data:
