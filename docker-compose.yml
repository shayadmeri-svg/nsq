name: nsq-platform

# Four long-running services behind one nginx gateway:
#
#   gateway   :80   /        -> web (React SPA)
#                   /api/    -> api (FastAPI: auth, orgs, dashboards, admin, jobs)
#   api             reads the in-server Redis, keeps users/orgs/audit/jobs in Postgres
#   postgres        users, organisations, sessions, invites, audit log, job runs, user plants
#   redis           the NSQ dataset + CDMO seeds (copied from Upstash by the
#                   "Pull from Upstash" job or ./pull-upstash.sh)
#
# Secrets come from .env (gitignored): REDIS_URL (Upstash), POSTGRES_PASSWORD,
# SUPERADMIN_EMAIL / SUPERADMIN_PASSWORD (first boot), APP_BASE_URL.

# Every container's log rotates (10 MB × 3) so logs never fill the disk.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

# Memory on a 4 GB host (t3.medium, ~3.8 GB usable). Each limit is a ceiling that keeps one service from starving the
# rest, sized from measured use (API ~650 MB with the NSQ data loaded, Connect ~60 MB): typical total ~1.6 GB, the
# ceilings add up to more because they do not all peak together; a 2 GB swapfile (deploy.sh) absorbs image builds.
# oom_score_adj: under host memory pressure the kernel ends the demo and optional services first, the data stores last.
services:
  redis:
    image: redis:7-alpine
    container_name: nsq-redis
    command: ["redis-server", "--appendonly", "yes", "--save", "300 1", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    expose: ["6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 384m          # maxmemory 256 MB + room for the append-only rewrite
    oom_score_adj: -500
    stop_grace_period: 20s   # time to flush the append-only file
    logging: *logging
    networks: [nsq-net]

  # Local Postgres, always on. The api uses it whenever DATABASE_URL is unset in .env
  # (set DATABASE_URL to use a managed database instead; this container then sits idle).
  # Data lives in the pg-data volume: never run `docker compose down -v` on this box.
  postgres:
    image: postgres:18-alpine
    container_name: nsq-postgres
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "effective_cache_size=384MB", "-c", "work_mem=8MB",
              "-c", "maintenance_work_mem=64MB", "-c", "max_connections=60"]
    environment:
      - POSTGRES_USER=nsq
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nsq-local-only}
      - POSTGRES_DB=nsq
    volumes:
      - pg-data:/var/lib/postgresql
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nsq -d nsq"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 640m
    oom_score_adj: -500
    stop_grace_period: 30s   # a clean shutdown checkpoints instead of recovering on the next start
    logging: *logging
    networks: [nsq-net]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: nsq-api:local
    container_name: nsq-api
    environment:
      # Managed Postgres (Neon, RDS, ...): set DATABASE_URL in .env. The
      # plain "postgresql://" URL the provider gives you works as-is.
      # Unset = the local postgres container (needs --profile local-db).
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://nsq:${POSTGRES_PASSWORD:-nsq-local-only}@postgres:5432/nsq}
      # The Redis the app reads. NSQ_REDIS_URL overrides it (escape hatch).
      - REDIS_URL=${NSQ_REDIS_URL:-redis://redis:6379/0}
      # Upstream copy on Upstash — only the Sync/refresh jobs touch it.
      - UPSTASH_URL=${REDIS_URL:-}
      - SUPERADMIN_EMAIL=${SUPERADMIN_EMAIL:-}
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD:-}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-12}
      - CORS_ORIGINS=
      - SCHEDULER=${SCHEDULER:-on}
      - SIM_URL=${SIM_URL:-http://sim:8010}
      - SCHEDULE_TZ=${SCHEDULE_TZ:-Asia/Kolkata}
      - UNIVERSE_MIN_ALERTS=${UNIVERSE_MIN_ALERTS:-5}
      - UNIVERSE_MAX_AUTO=${UNIVERSE_MAX_AUTO:-250}
      # Source keys for data jobs (optional; set them in .env): FDA Data Dashboard API (FDA inspections),
      # UN Comtrade (full API instead of the public preview)
      - FDA_DD_USER=${FDA_DD_USER:-}
      - FDA_DD_KEY=${FDA_DD_KEY:-}
      - COMTRADE_KEY=${COMTRADE_KEY:-}
      - INDIA_PROXY=${INDIA_PROXY:-}
      - WC_MIN_FREE_GB=${WC_MIN_FREE_GB:-3}
      # Plant data demo: the connector the plant-sim service streams with (both empty = no demo connector)
      - PLANT_SIM_TOKEN=${PLANT_SIM_TOKEN:-}
      - PLANT_SIM_ORG=${PLANT_SIM_ORG:-}
      - PLANT_LIVE_RETAIN_H=${PLANT_LIVE_RETAIN_H:-24}
    volumes:
      # Seeds, snapshot and CSV uploads. Read-write: the snapshot and
      # refresh jobs write here.
      - ./data:/app/data
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 1536m
    stop_grace_period: 25s   # finish requests in flight; uvicorn closes event streams after 15 s
    logging: *logging
    networks: [nsq-net]

  sim:
    # PharmaPy crystallisation engine for the lab. Optional: the API falls back to its
    # built-in engine when this is down.
    build:
      context: .
      dockerfile: sim/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    oom_score_adj: 500       # optional: the Lab falls back to its built-in engine
    logging: *logging
    expose:
      - "8010"
    networks: [nsq-net]

  connect:
    # Eurveda Connect: the integration service — plants, machines and how each is reached, edge agents, live state,
    # batches and alarms (Playground → Plant monitor). Same Postgres as the API, its own tables (cx_*).
    build:
      context: ./connect
    image: nsq-connect:local
    container_name: nsq-connect
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://nsq:${POSTGRES_PASSWORD:-nsq-local-only}@postgres:5432/nsq}
      - API_URL=http://api:8001
      - PLANT_SIM_TOKEN=${PLANT_SIM_TOKEN:-}
      - PLANT_SIM_ORG=${PLANT_SIM_ORG:-}
      - CONNECT_RETAIN_H=${CONNECT_RETAIN_H:-24}
    mem_limit: 256m
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 25s
    logging: *logging
    networks: [nsq-net]

  plant-sim:
    # Simulated granulator, dryer, blender and tablet press (OPC UA) read by the real edge agent and streamed to the
    # API, for demos of Playground → Plant data → Live; tuned from the Sim engine panel there.
    # Off unless asked for: docker compose --profile demo up -d plant-sim
    # Needs PLANT_SIM_TOKEN in .env (any long random string, e.g. evd_ + openssl rand -hex 24). It streams into a
    # "Eurveda demo plant" organisation the API creates, or into PLANT_SIM_ORG (an organisation slug) if set.
    profiles: ["demo"]
    build:
      context: ./edge-agent
    image: nsq-plant-sim:local
    container_name: nsq-plant-sim
    environment:
      - EURVEDA_TOKEN=${PLANT_SIM_TOKEN:-}
      - EURVEDA_URL=http://api:8001
      - CONNECT_URL=http://connect:8020
    mem_limit: 384m
    oom_score_adj: 800       # the demo goes first under memory pressure
    logging:  # the agent logs every push: keep at most ~10 MB
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
    depends_on:
      api: { condition: service_healthy }
      connect: { condition: service_healthy }
    restart: unless-stopped
    networks: [nsq-net]

  web:
    build:
      context: ./web
    image: nsq-web:local
    container_name: nsq-web
    expose: ["80"]
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging
    networks: [nsq-net]

  gateway:
    image: nginx:alpine
    container_name: nsq-gateway
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
      connect: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    mem_limit: 96m
    logging: *logging
    networks: [nsq-net]

  # HTTPS (profile "https"): Caddy takes 80/443 and proxies to the gateway. On the server set DOMAIN, and
  # GATEWAY_PORT=127.0.0.1:8080 so the gateway is no longer published on 80 itself.
  caddy:
    image: caddy:2.8.4-alpine
    container_name: nsq-caddy
    profiles: [https]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      gateway: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging
    networks: [nsq-net]

networks:
  nsq-net:
    driver: bridge

volumes:
  redis-data:
  pg-data:
  caddy-data:
  caddy-config:
