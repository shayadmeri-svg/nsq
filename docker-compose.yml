name: nsq-platform

# Both services read live data from Redis (populated by
# redis-loader/load_nsq_redis.py — see redis-loader/README or the
# top-level README for that step). Set REDIS_URL in a .env file next to
# this compose file before running `docker compose up`:
#
#   echo 'REDIS_URL=rediss://default:PASSWORD@your-instance.upstash.io:6379' > .env
#
# Never commit .env — it's already gitignored.

services:
  analytics:
    build:
      context: ./analytics
    image: nsq-analytics:local
    container_name: nsq-analytics
    ports:
      - "8501:8501"
    environment:
      - REDIS_URL=${REDIS_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/analytics/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - nsq-net

  simulator:
    build:
      context: ./simulator
    image: nsq-simulator:local
    container_name: nsq-simulator
    ports:
      - "8502:8502"
    environment:
      - REDIS_URL=${REDIS_URL}
      - CDMO_ENGINE_URL=http://engine:8000
      # Optional — paste a Gemini key to switch D3 diagnostics from the
      # local heuristic engine to live generative output. Leave unset to
      # stay fully offline.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      analytics:
        condition: service_healthy
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8502/simulator/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - nsq-net

  engine:
    build:
      context: ./engine
    image: nsq-engine:local
    container_name: nsq-engine
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=${REDIS_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - nsq-net

  # Manufacturer (tenant) app — user-facing Q-engine dashboard. One app,
  # config-driven tenant (NSQ_TENANT). Phase 1: dashboard only; no
  # depends_on the engine/simulator (those come in phase 2 diagnostics).
  manufacturer:
    build:
      context: ./manufacturer
    image: nsq-manufacturer:local
    container_name: nsq-manufacturer
    ports:
      - "8503:8503"
    environment:
      - REDIS_URL=${REDIS_URL}
      - NSQ_TENANT=${NSQ_TENANT:-regent-ajanta-biotech}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8503/manufacturer/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - nsq-net

  # manufacturer-api — the FastAPI wrapper over the headless diagnostics/GMP/
  # pharmacopeia cores + Plotly chart builders, serving the React frontend.
  # Replaces the Streamlit render layer; the Streamlit `manufacturer` service
  # above stays on 8503 for parity verification until the cutover.
  manufacturer-api:
    build:
      context: ./manufacturer_api
    image: nsq-manufacturer-api:local
    container_name: nsq-manufacturer-api
    expose:
      - "8001"
    environment:
      - REDIS_URL=${REDIS_URL}
      # No NSQ_TENANT here, deliberately: unlike the Streamlit `manufacturer`
      # service (one container = one tenant, resolved from the env var), the
      # API takes the tenant from the request path
      # (/api/manufacturer/{tenant_key}/...) and never calls
      # tenants.get_active_tenant(). An NSQ_TENANT set here would look like a
      # working knob and do nothing.
      - MANUFACTURER_API_CORS_ORIGINS=${MANUFACTURER_API_CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - nsq-net

  # web — the React SPA (Vite build) served by nginx. Internal port 80; only
  # the gateway publishes a host port (8080) in the default topology.
  web:
    build:
      context: ./web
    image: nsq-web:local
    container_name: nsq-web
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - nsq-net

  # gateway — THE single entry point. Serves the SPA at / and proxies every
  # other service under its own path (see gateway/nginx.conf):
  #   /analytics/  /simulator/  /manufacturer/  /engine/  /api/manufacturer/
  # Published on host port 80 so the deployed box needs no separate nginx.
  # Set GATEWAY_PORT in .env if something else already owns 80 on the host
  # (e.g. an existing system nginx you want to keep in front).
  gateway:
    image: nginx:alpine
    container_name: nsq-gateway
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      web:
        condition: service_healthy
      manufacturer-api:
        condition: service_healthy
      analytics:
        condition: service_healthy
      simulator:
        condition: service_healthy
      manufacturer:
        condition: service_healthy
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - nsq-net

networks:
  nsq-net:
    driver: bridge
